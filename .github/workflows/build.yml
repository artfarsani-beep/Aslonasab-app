name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      # ابتدا پروژه اندروید ساخته می‌شود
      - run: flutter create --project-name=aslonasab_app --platforms=android --overwrite .
      
      # سپس فایل کد اصلی شجره‌نامه شما جایگزین فایل پیش‌فرض فلاتر می‌شود
      - run: git checkout HEAD -- lib/main.dart
      
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
